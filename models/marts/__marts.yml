version: 2

models:

  - name: mart_sales
    description: "Revenue aggregated by product, category, date and channel"
    access: public
    columns:
      - name: ORDER_YEAR
        description: "Year of order"
        tests: [not_null]
      - name: ORDER_MONTH
        description: "Month of order (truncated to first day)"
        tests: [not_null]
      - name: CATEGORY
        tests: [not_null]
      - name: PRODUCT_ID
        tests: [not_null]
      - name: PRODUCT_NAME
        tests: [not_null]
      - name: TOTAL_ORDERS
        description: "Count of distinct orders"
      - name: TOTAL_UNITS_SOLD
        description: "Sum of quantity sold"
      - name: TOTAL_REVENUE
        description: "Sum of effective line totals after discount"
      - name: GROSS_PROFIT
        description: "Total revenue minus total cost"

  - name: mart_customers
    description: "Customer lifetime value metrics and spend segments"
    columns:
      - name: CUSTOMER_ID
        description: "Primary key"
        tests: [unique, not_null]
      - name: LOYALTY_TIER
        tests:
          - accepted_values:
              values: ['Bronze', 'Silver', 'Gold', 'Platinum']
      - name: SPEND_SEGMENT
        description: "HIGH (>50k), MEDIUM (10k-50k), LOW (<10k)"
        tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']
      - name: TOTAL_ORDERS
        description: "Lifetime order count excluding cancelled orders"
      - name: TOTAL_SPEND
        description: "Lifetime total spend excluding cancelled orders"

  - name: mart_product_performance
    description: "Product-level revenue, margin and category ranking"
    columns:
      - name: PRODUCT_ID
        description: "Primary key"
        tests: [unique, not_null]
      - name: PRODUCT_NAME
        tests: [not_null]
      - name: TOTAL_REVENUE
        description: "Total revenue generated by this product"
      - name: TOTAL_GROSS_PROFIT
        description: "Total profit after cost of goods"
      - name: REVENUE_RANK_IN_CATEGORY
        description: "Rank of product by revenue within its category (1 = highest)"